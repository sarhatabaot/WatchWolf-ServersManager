name: Release ServersManager image

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      WATCHWOLF_SERVER_VERSION: '0.3.1'
    steps:
      - uses: actions/checkout@v4
      - name: Derive manager version from release tag
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          [[ "$RELEASE_TAG" == v* ]]
          echo "number=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ci/ghcr/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/watchwolf-servers-manager:${{ github.event.release.tag_name }}
          build-args: |
            MANAGER_VERSION=${{ steps.version.outputs.number }}
            WATCHWOLF_SERVER_VERSION=${{ env.WATCHWOLF_SERVER_VERSION }}
